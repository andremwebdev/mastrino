<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d6a4b">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}@media (prefers-color-scheme: dark){:root{color-scheme:dark}}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mastrino">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Mastrino</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: un registro contabile. Fogli bianchi su carta grigio-verde; Dare in inchiostro blu, Avere in inchiostro rosso, come nel libro giornale. Una colonna stretta, barra di navigazione in basso per il telefono. */
:root{
  --paper:#eaf0ec; --sheet:#ffffff; --ink:#17211c; --muted:#56675e; --rule:#cfdad3; --rule2:#e4ebe6;
  --accent:#0d6a4b; --accent-bg:#dcefe5; --on-accent:#ffffff;
  --dare:#1c4ca3; --dare-bg:#e5ecf9; --avere:#a2213a; --avere-bg:#f8e6e9;
  --warn:#7f4d00; --warn-bg:#fbefd6; --tip:#22543f; --tip-bg:#e3f1ea;
  --ok:#0f6e4b; --ok-bg:#d9f0e4; --ko:#ac2539; --ko-bg:#fae3e7;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101613; --sheet:#18201c; --ink:#e4ebe7; --muted:#97a89f; --rule:#2c3832; --rule2:#222c27;
  --accent:#57c79b; --accent-bg:#163227; --on-accent:#08130e;
  --dare:#8fb1f2; --dare-bg:#1a2640; --avere:#f19aaa; --avere-bg:#3a1c24;
  --warn:#f2bd62; --warn-bg:#352812; --tip:#8fd6b5; --tip-bg:#142b21;
  --ok:#6ed4a7; --ok-bg:#133024; --ko:#f39aa8; --ko-bg:#3a1a21; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101613; --sheet:#18201c; --ink:#e4ebe7; --muted:#97a89f; --rule:#2c3832; --rule2:#222c27;
  --accent:#57c79b; --accent-bg:#163227; --on-accent:#08130e;
  --dare:#8fb1f2; --dare-bg:#1a2640; --avere:#f19aaa; --avere-bg:#3a1c24;
  --warn:#f2bd62; --warn-bg:#352812; --tip:#8fd6b5; --tip-bg:#142b21;
  --ok:#6ed4a7; --ok-bg:#133024; --ko:#f39aa8; --ko-bg:#3a1a21; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,.mono{font-family:var(--mono);font-size:.92em}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:.2px}
.tacc{display:inline-grid;grid-template-columns:1fr 1fr;width:34px;height:26px;border-top:2.5px solid var(--ink);font:700 11px/1 var(--mono);text-align:center;padding-top:5px;position:relative}
.tacc::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2.5px solid var(--ink)}
.tacc .d{color:var(--dare)} .tacc .a{color:var(--avere)}
.sub{font-size:12px;color:var(--muted);text-align:right}

main{padding-block:16px 110px}
h2{font-size:22px;line-height:1.2;margin:4px 0 4px;text-wrap:balance}
h3{font-size:17px;margin:0 0 6px;text-wrap:balance}
h4{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 0 8px}
p{margin:6px 0}
.lead{color:var(--muted);margin:0 0 14px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 14px 16px;min-width:0}
ul,ol{margin:6px 0;padding-left:20px} li{margin:3px 0}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabsin{display:grid;grid-template-columns:repeat(4,1fr);max-width:760px;margin:0 auto;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{background:none;border:0;padding:9px 4px 10px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;border-top:3px solid transparent}
.tab b{font-size:16px;line-height:1.1;font-weight:600;font-family:var(--mono)}
.tab[aria-current="true"]{color:var(--accent);border-top-color:var(--accent);font-weight:600}

/* chips & segmented */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--rule2);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:8px;padding:8px 4px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:5px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* buttons */
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.okb{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.btn.kob{background:var(--ko-bg);border-color:transparent;color:var(--ko)}
.btn.sm{padding:6px 10px;font-size:13px}

/* ledger rows */
.entry{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.elab{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.row{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:start;padding:8px 10px;border-radius:9px;border-left:4px solid}
.row.rd{background:var(--dare-bg);border-color:var(--dare)}
.row.ra{background:var(--avere-bg);border-color:var(--avere)}
.side{font:700 11.5px/1.9 var(--mono);text-transform:uppercase;letter-spacing:.4px}
.rd .side{color:var(--dare)} .ra .side{color:var(--avere)}
.rmain{min-width:0}
.rname{font-weight:600;line-height:1.3}
.rmeta{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:3px;font-size:12.5px;color:var(--muted)}
.tg{font:700 11px/1 var(--mono);padding:3px 5px;border-radius:4px;background:var(--sheet);color:var(--ink);border:1px solid var(--rule)}
.tg.tw{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.coll{font-size:12.5px}
.coll code{font-weight:700;color:var(--ink)}
.ramt{font:600 14px/1.4 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.tot{display:flex;justify-content:flex-end;gap:14px;font:12px var(--mono);color:var(--muted);padding:2px 4px}

/* callouts */
.tip,.warn,.key{border-radius:9px;padding:9px 11px;margin:10px 0;font-size:14px}
.tip{background:var(--tip-bg);color:var(--tip)}
.warn{background:var(--warn-bg);color:var(--warn)}
.key{background:var(--accent-bg);color:var(--ink);font-weight:600}

/* variation grid */
.vg{display:grid;grid-template-columns:auto 1fr 1fr;border:1px solid var(--rule);border-radius:10px;overflow:hidden;font-size:14px;margin:8px 0}
.vg div{padding:9px 10px;border-top:1px solid var(--rule2)}
.vg .h{font-weight:700;background:var(--rule2);border-top:0}
.vg .dd{color:var(--dare);font:700 15px var(--mono)} .vg .aa{color:var(--avere);font:700 15px var(--mono)}

/* tables */
.tw-x{overflow-x:auto;margin:8px 0}
table.mt{border-collapse:collapse;width:100%;font-size:13.5px}
.mt th,.mt td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule2);vertical-align:top}
.mt th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.mt td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.mt tr.sum td{font-weight:700;border-top:2px solid var(--rule)}

/* accordion */
details.acc{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
details.acc>summary{list-style:none;padding:14px;font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";font:400 22px/1 var(--mono);color:var(--muted)}
details.acc[open]>summary::after{content:"−"}
details.acc>summary small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.accb{padding:0 14px 16px;min-width:0}
.schema{font-size:14px}
.schema .L{font-weight:700;margin-top:8px}
.schema .S{padding-left:14px;color:var(--ink)}
.schema .S span{color:var(--muted)}

/* codes list */
.codes{list-style:none;padding:0;display:grid;gap:4px}
.codes li{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:baseline;margin:0}
.codes code{font-weight:700}

/* quiz */
.qtext{font-size:16px;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{text-align:left;border:1.5px solid var(--rule);background:var(--sheet);border-radius:10px;padding:11px 12px;font-size:14.5px}
.opt.good{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.opt.bad{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px}
.fb.ok{background:var(--ok-bg)} .fb.ko{background:var(--ko-bg)}
.fb b{display:block;margin-bottom:2px}
.score{font:600 13px var(--mono);color:var(--muted)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);background:var(--accent-bg);border-radius:5px;padding:3px 7px}

/* verifica */
.vitem{border-top:1px solid var(--rule2);padding:12px 0}
.vitem:first-of-type{border-top:0}
.vnum{font:700 13px var(--mono);color:var(--muted);margin-right:6px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.tacct{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px;min-width:0}
.tacct h5{margin:0 0 6px;font-size:13.5px;text-align:center}
.tbody{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink);font:12.5px/1.6 var(--mono);font-variant-numeric:tabular-nums}
.tbody>div{padding:4px 6px;min-width:0}
.tbody>div:first-child{border-right:2px solid var(--ink)}
.tbody .hd{font-size:10.5px;text-transform:uppercase;color:var(--muted);font-family:var(--sans);font-weight:700}
.tbody .ln{display:flex;justify-content:space-between;gap:6px}
.tbody .ln i{color:var(--muted);font-style:normal}
.tsal{text-align:center;font:600 12px var(--mono);margin-top:6px;color:var(--muted)}

/* conti */
.search{width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink);font:inherit;margin-bottom:12px}
.clist{display:flex;flex-direction:column}
.citem{padding:10px 0;border-top:1px solid var(--rule2)}
.citem:first-child{border-top:0}
.citem .cn{font-weight:600}
.citem .cm{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px;color:var(--muted);margin-top:2px}
.citem .cnote{font-size:13px;color:var(--warn);margin-top:3px}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);font-weight:700;margin:16px 0 2px}
.small{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.btn{transition:background-color .12s,border-color .12s}}
@media (max-width:420px){.row{grid-template-columns:1fr auto}.side{grid-column:1/-1;line-height:1}.rmain{grid-column:1}.codes li{grid-template-columns:84px 1fr}}
</style>
</head>

function varOf(k,s){return A[k].t==='F'?(s==='D'?'VFA':'VFP'):(s==='D'?'VEN':'VEP')}
function collShort(k){var a=A[k];return a.sp==='CE'?'CE '+a.code:'SP '+(a.pass?'passivo ':'attivo ')+a.code}

/* ============ RENDER RIGHE ============ */
function rowHTML(k,s,v){var a=A[k];
 return '<div class="row '+(s==='D'?'rd':'ra')+'"><span class="side">'+(s==='D'?'Dare':'Avere')+'</span>'+
 '<div class="rmain"><div class="rname">'+a.n+'</div><div class="rmeta"><span class="tg">'+a.t+'</span><span class="tg">'+varOf(k,s)+'</span>'+
 '<span class="coll">'+(a.sp)+' '+(a.sp==='SP'?(a.pass?'pass. ':'att. '):'')+'<code>'+a.code+'</code> '+a.voce+'</span>'+(a.warn?'<span class="tg tw">vedi nota</span>':'')+'</div></div>'+
 (v!=null?'<div class="ramt">'+E(v)+'</div>':'<div></div>')+'</div>'}
function sch(rows,label){var h='<div class="entry">'+(label?'<div class="elab">'+label+'</div>':'');
 rows.forEach(function(r){h+=rowHTML(r[0],r[1],r.length>2?r[2]:null)});return h+'</div>'}
function entriesHTML(op){var h='';var warns={};
 op.e.forEach(function(en){h+=sch(en.r,en.l);var d=0,a=0;en.r.forEach(function(r){if(r[1]==='D')d+=r[2];else a+=r[2];if(A[r[0]].warn)warns[r[0]]=1});
  h+='<div class="tot"><span>Tot. Dare '+E(r2(d))+'</span><span>Tot. Avere '+E(r2(a))+'</span></div>'});
 if(op.n)h+='<p class="tip">'+op.n+'</p>';
 Object.keys(warns).forEach(function(k){h+='<p class="warn"><b>'+A[k].n+':</b> '+A[k].note+'</p>'});
 return h}

 if(t==='amm'){var C=R(10000,90000,1000),p=pick([10,12,15,20,25]);q='Quota di ammortamento: costo storico '+E(C)+', aliquota '+p+'%?';o=[{t:E(r2(C*p/100)),ok:1},{t:E(r2(C*(100-p)/100))},{t:E(r2(C/p))},{t:E(r2(C*p/1000))}];x='Costo storico × aliquota.'}

  o=[{t:(d>0?'Plusvalenza di ':'Minusvalenza di ')+E(Math.abs(d)),ok:1},{t:(d>0?'Minusvalenza di ':'Plusvalenza di ')+E(Math.abs(d))},{t:'Minusvalenza di '+E(Math.abs(C2-P))},{t:'Plusvalenza di '+E(Math.abs(P-F))}];

  sch([['amm','D'],['fondoAmm','A']],'Ammortamento (31/12)')+
  '<p>Quota = costo storico × aliquota. Esempio: 20.000 × 15% = 3.000.</p><p>Il fondo ammortamento <b>non</b> va nel passivo: nello SP il bene compare al netto (costo − fondo).</p>'+
  '<h4>Cessione di un bene in parte ammortizzato</h4><ol><li>Valore contabile = costo storico − fondo ammortamento.</li><li>Prezzo − valore contabile: positivo = <b>plusvalenza</b> (CE A.5), negativo = <b>minusvalenza</b> (CE B.14).</li></ol>'+
  '<p>Esempio del PDF: 20.000 − 16.000 = 4.000. Venduto a 5.000: plusvalenza di 1.000.</p>'+
  sch([['debitori','D'],['macchinari','A'],['ivaDeb','A']],'1 · Cessione (al prezzo di vendita)')+sch([['fondoAmm','D'],['macchinari','A']],'2 · Storno del fondo')+
  sch([['macchinari','D'],['plus','A']],'3a · Se plusvalenza')+sch([['minus','D'],['macchinari','A']],'3b · Se minusvalenza')+
  '<p class="warn">Il PDF del prof di sostegno, nella minusvalenza, mette anche Macchinari in Dare: è sbagliato, la scrittura non quadrerebbe. Con la minusvalenza Macchinari va in <b>Avere</b>. Controllo: dopo le 3 scritture il conto Macchinari fa zero.</p>'+
  '<h4>Nota integrativa (art. 2427 n. 2)</h4><p>Per ogni immobilizzazione si mostrano i movimenti dell’anno. Esempio:</p>'+
  '<div class="tw-x"><table class="mt"><tr><td>Costo storico a inizio anno</td><td class="n">50.000</td></tr><tr><td>Fondo ammortamento a inizio anno</td><td class="n">−20.000</td></tr><tr class="sum"><td>Valore a inizio anno</td><td class="n">30.000</td></tr><tr><td>+ Acquisti</td><td class="n">10.000</td></tr><tr><td>− Cessioni (valore contabile)</td><td class="n">−4.000</td></tr><tr><td>− Ammortamento dell’anno</td><td class="n">−7.500</td></tr><tr class="sum"><td>Valore a fine anno, va nello SP</td><td class="n">28.500</td></tr></table></div>'}},
 {id:'cred',t:'Crediti, insoluti e fondo',s:'Insoluti, perdite, fondo svalutazione, sopravvenienze',h:function(){return ''+
  sch([['insoluti','D'],['crediti','A']],'1 · Il cliente non paga alla scadenza')+
  '<p>È un giroconto: il credito c’è ancora e in bilancio resta in <code>C.II.1</code>. Cambia solo il nome del conto, per evidenziarlo.</p>'+
  sch([['banca','D'],['intAtt','A'],['insoluti','A']],'2a · Paga in ritardo, con interessi di mora')+
  sch([['perdite','D'],['insoluti','A']],'2b · Non pagherà mai, non c’è il fondo')+
  sch([['fsc','D'],['perdite','D'],['insoluti','A']],'2c · Non pagherà mai, c’è il fondo')+
  '<p>Prima si usa il fondo; solo la parte che il fondo non copre va in Perdite su crediti. Esempio: insoluto 8.000, fondo 5.000 → Fondo 5.000 e Perdite 3.000 in Dare, Crediti insoluti 8.000 in Avere.</p>'+
  '<p class="tip">Molti libri precisano che il fondo copre i crediti degli anni passati. Se il credito perso è nato quest’anno, va direttamente in Perdite su crediti.</p>'+
  sch([['sval','D'],['fsc','A']],'3 · Accantonamento al fondo (31/12)')+
  '<p>Si stima la parte dei crediti che non verrà incassata (es. 2% dei crediti). Svalutazione crediti è un costo in <code>CE B.10.d</code>. Il fondo si sottrae dai crediti: in bilancio i crediti valgono quanto pensi di incassare.</p>'+
  '<p class="warn">Il prof lo chiama "fondo rischi su crediti": è lo stesso conto. Non confonderlo con i Fondi per rischi e oneri del passivo B.</p>'+
  '<h4>4 · Sopravvenienze</h4><ul><li><b>Attive</b> (<code>CE A.5</code>): un ricavo inatteso legato al passato. Es. incassi un credito che avevi già eliminato come perso.</li><li><b>Passive</b> (<code>CE B.14</code>): un costo o una perdita inattesa legata al passato.</li></ul>'+
  sch([['banca','D'],['soprAtt','A']],'Incasso di un credito già eliminato')+
  '<p class="tip">Dal 2016 nel CE non esiste più la sezione E dei componenti straordinari: sopravvenienze, plusvalenze e minusvalenze stanno in A.5 e B.14.</p>'}},
 {id:'pers',t:'Personale e TFR',s:'Stipendi, contributi, F24, TFR',h:function(){return ''+
  '<p><b>Lordo</b> − contributi a carico del dipendente (INPS, 9,19%) − ritenute IRPEF = <b>netto</b> in busta paga.</p>'+
  sch([['salari','D'],['debPrev','A'],['erario','A'],['personale','A']],'1 · Liquidazione degli stipendi (fine mese)')+
  sch([['oneri','D'],['debPrev','A']],'2 · Contributi a carico dell’azienda (circa 30% del lordo)')+
  sch([['personale','D'],['banca','A']],'3 · Pagamento del netto')+
  sch([['debPrev','D'],['erario','D'],['banca','A']],'4 · Versamento con F24 (entro il 16 del mese dopo)')+
  '<p>Debiti v/istituti previdenziali raccoglie entrambi i contributi, quelli del dipendente e quelli dell’azienda.</p>'+
  sch([['tfr','D'],['debTfr','A']],'TFR · Accantonamento (31/12)')+
  '<p>Quota annua = retribuzioni annue lorde ÷ 13,5. Esempio: 135.000 ÷ 13,5 = 10.000.</p>'+
  '<p class="tip">Se il prof chiede la rivalutazione: il TFR già accumulato si rivaluta ogni anno dell’1,5% fisso + 75% dell’inflazione ISTAT, con un’imposta sostitutiva del 17% sulla rivalutazione.</p>'+
  sch([['debTfr','D'],['erario','A'],['personaleLiq','A']],'TFR · Liquidazione al dipendente che lascia')+sch([['personaleLiq','D'],['banca','A']],'TFR · Pagamento')}},
 {id:'bil',t:'Il bilancio d’esercizio',s:'Art. 2423, schemi 2424 e 2425, abbreviato, nota integrativa',h:function(){return ''+
  '<h4>I documenti (art. 2423)</h4><p>Stato patrimoniale, conto economico, rendiconto finanziario e nota integrativa. Il bilancio deve rappresentare in modo <b>chiaro, veritiero e corretto</b> la situazione patrimoniale e finanziaria e il risultato economico. La relazione sulla gestione lo accompagna ma non ne fa parte.</p>'+
  '<p>Come si leggono i codici: lettera maiuscola (macroclasse) → numero romano (classe) → numero arabo (voce) → lettera minuscola (sottovoce). Es. <code>C.II.1</code>, <code>B.9.a</code>.</p>'+
  '<h4>Stato patrimoniale (art. 2424), a sezioni contrapposte</h4><div class="schema">'+
  '<div class="L">ATTIVO</div><div class="L">A) Crediti verso soci per versamenti ancora dovuti</div><div class="L">B) Immobilizzazioni</div>'+
  '<div class="S">I Immateriali <span>1 costi di impianto e ampliamento · 2 costi di sviluppo · 3 brevetti e opere dell’ingegno · 4 concessioni, licenze, marchi · 5 avviamento · 6 in corso e acconti · 7 altre</span></div>'+
  '<div class="S">II Materiali <span>1 terreni e fabbricati · 2 impianti e macchinario · 3 attrezzature industriali e commerciali · 4 altri beni · 5 in corso e acconti</span></div>'+
  '<div class="S">III Finanziarie <span>1 partecipazioni · 2 crediti · 3 altri titoli · 4 strumenti finanziari derivati attivi</span></div>'+
  '<div class="L">C) Attivo circolante</div><div class="S">I Rimanenze <span>1 materie prime, sussidiarie e di consumo · 2 prodotti in corso di lavorazione e semilavorati · 3 lavori in corso su ordinazione · 4 prodotti finiti e merci · 5 acconti</span></div>'+
  '<div class="S">II Crediti <span>1 verso clienti · 2 controllate · 3 collegate · 4 controllanti · 5 sottoposte al controllo delle controllanti · 5-bis crediti tributari · 5-ter imposte anticipate · 5-quater verso altri</span></div>'+
  '<div class="S">III Attività finanziarie non immobilizzate <span>1-4 partecipazioni · 5 derivati attivi · 6 altri titoli · 7 gestione accentrata della tesoreria</span></div>'+
  '<div class="S">IV Disponibilità liquide <span>1 depositi bancari e postali · 2 assegni · 3 danaro e valori in cassa</span></div><div class="L">D) Ratei e risconti</div>'+
  '<div class="L" style="margin-top:14px">PASSIVO</div><div class="L">A) Patrimonio netto</div><div class="S"><span>I capitale · II riserva da sovrapprezzo azioni · III riserve di rivalutazione · IV riserva legale · V riserve statutarie · VI altre riserve · VII riserva copertura flussi finanziari attesi · VIII utili (perdite) portati a nuovo · IX utile (perdita) dell’esercizio · X riserva negativa azioni proprie</span></div>'+
  '<div class="L">B) Fondi per rischi e oneri</div><div class="S"><span>1 trattamento di quiescenza · 2 imposte, anche differite · 3 derivati passivi · 4 altri</span></div>'+
  '<div class="L">C) Trattamento di fine rapporto di lavoro subordinato</div>'+
  '<div class="L">D) Debiti <span class="small">(indicando a parte quelli esigibili oltre l’esercizio successivo)</span></div><div class="S"><span>1 obbligazioni · 2 obbligazioni convertibili · 3 verso soci per finanziamenti · 4 verso banche · 5 verso altri finanziatori · 6 acconti · 7 verso fornitori · 8 rappresentati da titoli di credito · 9 controllate · 10 collegate · 11 controllanti · 11-bis sottoposte al controllo delle controllanti · 12 tributari · 13 verso istituti di previdenza e sicurezza sociale · 14 altri debiti</span></div><div class="L">E) Ratei e risconti</div></div>'+
  '<h4>Conto economico (art. 2425), in forma scalare</h4><div class="schema">'+
  '<div class="L">A) Valore della produzione</div><div class="S"><span>1 ricavi delle vendite e delle prestazioni · 2 variazioni rimanenze di prodotti · 3 variazioni lavori in corso su ordinazione · 4 incrementi di immobilizzazioni per lavori interni · 5 altri ricavi e proventi</span></div>'+
  '<div class="L">B) Costi della produzione</div><div class="S"><span>6 materie prime, sussidiarie, di consumo e merci · 7 servizi · 8 godimento di beni di terzi · 9 personale (a salari e stipendi, b oneri sociali, c TFR, d quiescenza, e altri costi) · 10 ammortamenti e svalutazioni (a immateriali, b materiali, c altre svalutazioni delle immobilizzazioni, d svalutazione dei crediti) · 11 variazioni rimanenze di materie e merci · 12 accantonamenti per rischi · 13 altri accantonamenti · 14 oneri diversi di gestione</span></div>'+
  '<div class="L">Differenza A − B</div><div class="L">C) Proventi e oneri finanziari</div><div class="S"><span>15 proventi da partecipazioni · 16 altri proventi finanziari (d = proventi diversi, es. interessi di mora) · 17 interessi e altri oneri finanziari · 17-bis utili e perdite su cambi</span></div>'+
  '<div class="L">D) Rettifiche di valore di attività e passività finanziarie</div><div class="S"><span>18 rivalutazioni · 19 svalutazioni</span></div>'+
  '<div class="L">Risultato prima delle imposte · 20 Imposte sul reddito · 21 Utile (perdita) dell’esercizio</div></div>'+
  '<h4>Bilancio in forma abbreviata (art. 2435-bis)</h4><p>Lo può fare chi non ha titoli quotati e, nel primo esercizio o per due esercizi di fila, non supera <b>2 di questi 3 limiti</b>:</p>'+
  '<div class="tw-x"><table class="mt"><tr><th></th><th>In vigore (dal 2024)</th><th>Prima</th></tr><tr><td>Totale attivo SP</td><td class="n">5.500.000</td><td class="n">4.400.000</td></tr><tr><td>Ricavi delle vendite</td><td class="n">11.000.000</td><td class="n">8.800.000</td></tr><tr><td>Dipendenti medi</td><td class="n">50</td><td class="n">50</td></tr></table></div>'+
  '<p>Semplificazioni: SP con solo lettere maiuscole e numeri romani; CE con alcune voci raggruppate; niente rendiconto finanziario; nota integrativa ridotta; relazione sulla gestione omettibile se le informazioni sulle azioni proprie sono in nota integrativa.</p>'+
  '<p class="tip">Se il tuo libro riporta 4.400.000 e 8.800.000, sono i limiti vecchi: il prof probabilmente userà quelli del libro.</p>'+
  '<h4>Micro-imprese (art. 2435-ter)</h4><p>Limiti: attivo 220.000, ricavi 440.000, 5 dipendenti (prima 175.000 e 350.000). Schemi come l’abbreviato, esonero da rendiconto finanziario, nota integrativa (se in calce allo SP ci sono garanzie, impegni e compensi agli amministratori) e relazione sulla gestione.</p>'+
  '<h4>Valori al netto</h4><p>Fondo ammortamento e fondo svalutazione crediti non compaiono come voci: si sottraggono dal bene e dai crediti. Nello SP leggi il valore netto; il dettaglio va in nota integrativa.</p>'+
  '<h4>Crediti verso soci (azionisti)</h4>'+sch([['azionisti','D'],['capitale','A']],'Sottoscrizione del capitale')+sch([['banca','D'],['azionisti','A']],'Versamento')+
  '<p>La parte sottoscritta ma non versata resta nell’attivo <code>A</code>. Il capitale va nel passivo <code>A.I</code>.</p>'}}
];
function pageTeoria(){var h='<h2>Teoria</h2><p class="lead">Una scheda per argomento. Le scritture usano il formato del prof: conto, Dare/Avere, F/E, variazione, collocazione.</p><div class="stack">';
 TEORIA.forEach(function(t,i){h+='<details class="acc" id="t-'+t.id+'"'+(S.open===t.id?' open':'')+'><summary><span>'+t.t+'<small>'+t.s+'</small></span></summary><div class="accb">'+t.h()+'</div></details>'});
 return h+'</div>'}

function chips(map,cur,act){return '<div class="chips">'+Object.keys(map).map(function(k){return '<button class="chip" data-act="'+act+'" data-v="'+k+'" aria-pressed="'+(k===cur)+'">'+map[k]+'</button>'}).join('')+'</div>'}
function pageEs(){var h='<h2>Esercizi</h2><div class="seg" role="group"><button data-act="ex" data-v="scr" aria-pressed="'+(S.ex==='scr')+'">Scritture</button><button data-act="ex" data-v="quiz" aria-pressed="'+(S.ex==='quiz')+'">Quiz lampo</button><button data-act="ex" data-v="ver" aria-pressed="'+(S.ex==='ver')+'">Verifica simulata</button></div>';
 if(S.ex==='scr'){if(!S.op)S.op=genOp(S.cat);var op=S.op;var cm={all:'Tutto'};Object.keys(CAT).forEach(function(k){cm[k]=CAT[k]});
  h+=chips(cm,S.cat,'cat')+'<div class="card"><div class="meta"><span class="badge">'+CAT[op.cat]+'</span><span class="score">giuste '+S.st.scr.ok+'/'+S.st.scr.tot+'</span></div><h3>'+op.t+'</h3><p class="qtext">'+op.q+'</p>';
  if(!S.rev)h+='<p class="small">Scrivila su carta come in verifica: conti, Dare/Avere, importi, F/E, variazione, collocazione. Poi controlla.</p><div class="btns"><button class="btn pri" data-act="rev">Mostra soluzione</button><button class="btn" data-act="next">Un’altra</button></div>';
  else h+=entriesHTML(op)+'<div class="btns"><button class="btn okb" data-act="self" data-v="1">L’avevo giusta</button><button class="btn kob" data-act="self" data-v="0">Avevo sbagliato</button><button class="btn" data-act="next">Salta</button></div>';
  h+='</div>'}
 if(S.ex==='quiz'){if(!S.q)S.q=genQ(S.qt);var q=S.q;
  h+=chips(QT,S.qt,'qt')+'<div class="card"><div class="meta"><span class="badge">'+QT[S.qt]+'</span><span class="score">'+S.qs.ok+'/'+S.qs.tot+'</span></div><p class="qtext">'+q.q+'</p><div class="opts">';
  q.o.forEach(function(o,i){var c='';if(S.ans>=0){if(o.ok)c=' good';else if(i===S.ans)c=' bad'}h+='<button class="opt'+c+'" data-act="ans" data-v="'+i+'"'+(S.ans>=0?' disabled':'')+'>'+o.t+'</button>'});
  h+='</div>';if(S.ans>=0){var ok=q.o[S.ans].ok;h+='<div class="fb '+(ok?'ok':'ko')+'"><b>'+(ok?'Giusto.':'No.')+'</b>'+(q.x||'')+'</div>'+(q.xh?'<div class="small" style="margin-top:8px">Scrittura completa:</div>'+q.xh:'')+'<div class="btns"><button class="btn pri" data-act="nq">Prossima</button></div>'}
  h+='</div>'}
 if(S.ex==='ver'){if(!S.ver){h+='<div class="card"><h3>Come la verifica del prof</h3><p>15 operazioni di fila, da registrare a libro giornale con variazione e collocazione, poi i mastrini. Fallo su carta, a tempo, e confronta alla fine.</p><div class="btns"><button class="btn pri" data-act="nv">Genera una verifica</button></div></div>';return h}
  h+='<div class="card"><div class="meta"><h3 style="margin:0">La Alfa spa compie queste operazioni:</h3></div>';
  S.ver.forEach(function(op,i){h+='<div class="vitem"><p><span class="vnum">'+(i+1)+')</span>'+op.q+'</p>'+(S.vs[i]?entriesHTML(op):'')+'<div class="btns" style="margin-top:6px"><button class="btn sm" data-act="vt" data-v="'+i+'">'+(S.vs[i]?'Nascondi':'Soluzione')+'</button></div></div>'});
  h+='<div class="btns"><button class="btn" data-act="va">Mostra tutte le soluzioni</button><button class="btn" data-act="vm">'+(S.mast?'Nascondi i mastrini':'Mostra i mastrini')+'</button><button class="btn pri" data-act="nv">Nuova verifica</button></div></div>';
  if(S.mast)h+='<h4>Mastrini</h4><p class="small">Il numero a sinistra è l’operazione da cui viene l’importo.</p>'+mastriniHTML(S.ver)}
 return h}
function pageConti(){var h='<h2>Conti e collocazione</h2><p class="lead">Ogni conto con tipo e voce di bilancio. Cerca per nome o per codice.</p><input class="search" id="q" type="search" placeholder="Es. assegni, B.9, fondo…" value="'+(S.cq||'').replace(/"/g,'')+'"><div id="clist">'+contiList(S.cq||'')+'</div>';return h}
function contiList(f){f=f.toLowerCase().trim();var groups={};Object.keys(A).forEach(function(k){var a=A[k];var hay=(a.n+' '+a.code+' '+a.voce+' '+collShort(k)).toLowerCase();if(f&&hay.indexOf(f)<0)return;(groups[a.g]=groups[a.g]||[]).push(k)});
 var h='';Object.keys(groups).forEach(function(g){h+='<div class="grp">'+g+'</div><div class="clist">';groups[g].forEach(function(k){var a=A[k];
  h+='<div class="citem"><div class="cn">'+a.n+'</div><div class="cm"><span class="tg">'+(a.t==='F'?'F · Dare VFA / Avere VFP':'E · Dare VEN / Avere VEP')+'</span><span>'+a.sp+' '+(a.sp==='SP'?(a.pass?'passivo ':'attivo '):'')+'<code>'+a.code+'</code> '+a.voce+'</span></div>'+(a.note?'<div class="cnote">'+a.note+'</div>':'')+'</div>'});h+='</div>'});
 return h||'<p class="small">Nessun conto trovato.</p>'}

function render(){var m=$('#main');var p={flash:pageFlash,teoria:pageTeoria,es:pageEs,conti:pageConti}[S.tab]||pageFlash;m.innerHTML=p();
 document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-current',String(b.getAttribute('data-tab')===S.tab))})}

document.addEventListener('click',function(ev){var t=ev.target.closest('[data-tab],[data-act]');if(!t)return;
 if(t.hasAttribute('data-tab')){S.tab=t.getAttribute('data-tab');try{localStorage.setItem(KEY+'-tab',S.tab)}catch(e){}render();window.scrollTo(0,0);return}
 var a=t.getAttribute('data-act'),v=t.getAttribute('data-v');var top=false;
 if(a==='ex'){S.ex=v;top=true}
 else if(a==='cat'){S.cat=v;S.op=genOp(v);S.rev=false}
 else if(a==='rev'){S.rev=true}
 else if(a==='next'){S.op=genOp(S.cat);S.rev=false;top=true}
 else if(a==='self'){S.st.scr.tot++;if(v==='1')S.st.scr.ok++;save();S.op=genOp(S.cat);S.rev=false;top=true}
 else if(a==='qt'){S.qt=v;S.q=genQ(v);S.ans=-1}
 else if(a==='ans'){if(S.ans<0){S.ans=+v;S.qs.tot++;if(S.q.o[S.ans].ok)S.qs.ok++}}
 else if(a==='nq'){S.q=genQ(S.qt);S.ans=-1;top=true}
 else if(a==='nv'){S.ver=genVer();S.vs={};S.mast=false;top=true}
 else if(a==='vt'){S.vs[v]=!S.vs[v]}
 else if(a==='va'){var all=S.ver.every(function(_,i){return S.vs[i]});S.ver.forEach(function(_,i){S.vs[i]=!all})}
 else if(a==='vm'){S.mast=!S.mast}
 var y=window.scrollY;render();if(top)window.scrollTo(0,0);else window.scrollTo(0,y)});
document.addEventListener('toggle',function(ev){var d=ev.target;if(d.classList&&d.classList.contains('acc')&&d.open){S.open=d.id.slice(2)}},true);
document.addEventListener('input',function(ev){if(ev.target.id==='q'){S.cq=ev.target.value;$('#clist').innerHTML=contiList(S.cq)}});

render();
if(document.querySelector('link[rel="manifest"]')&&'serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
window.__mastrino={A:A,G:G,GEN:GEN,genQ:genQ,genVer:genVer,varOf:varOf};
})();
